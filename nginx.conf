server {
    listen 80;
    server_name localhost;

    # Root harus sesuai folder build Angular
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Angular SPA fallback
    location / {
        try_files $uri /index.html;
    }

    # Error page
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

events {}
